<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>4 de Julho</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  font-family:'Playfair Display',serif;
  background:#eaf4fb;
  background-image: radial-gradient(circle, #dceefc 1px, transparent 1px);
  background-size: 20px 20px;
  color:#3b5a6e;
  display:flex;flex-direction:column;align-items:center;
  padding:30px 12px;
  margin:0;
}
.frame{
  border:2px solid #d4af37;
  outline:1px solid #d4af37;
  outline-offset:8px;
  padding:30px 15px;
  background:#ffffff;
  width:100%;
  max-width:480px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}
.script{
  font-family:'Great Vibes',cursive;
  font-size:clamp(34px,9vw,48px);
  color:#6fa8c9;
  margin:0;
}
.sub{
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:13px;
  color:#6fa8c9;
  margin:5px 0 25px;
}
.divider{width:60px;height:1px;background:#d4af37;margin:15px auto}
.calendar{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:6px;margin:25px auto;width:100%;max-width:380px;
}
.day,.dow{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:clamp(11px,3.5vw,15px);border-radius:50%;
}
.dow{color:#6fa8c9;font-weight:bold;letter-spacing:1px;font-size:12px;text-transform:uppercase}
.day{border:1px solid #cde6f5;color:#4a7a96}
.empty{border:none}
.highlight{
  background:#d4af37;color:#ffffff;font-weight:bold;
  font-size:18px;border:none;
  box-shadow:0 0 0 4px #eaf4fb, 0 0 0 5px #d4af37;
}
.countdown{
  margin-top:25px;
  font-size:14px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#6fa8c9;
}
.countdown span{
  display:block;
  font-family:'Great Vibes',cursive;
  font-size:clamp(40px,12vw,60px);
  color:#3b5a6e;
  letter-spacing:0;
  margin-top:5px;
}
.ornament{font-size:20px;color:#d4af37;margin:10px 0}
</style>
</head>
<body>
<div class="frame">
  <div class="ornament">✦ ❀ ✦</div>
  <p class="script">Save the Date</p>
  <p class="sub">04 · Julho · Sábado</p>
  <div class="divider"></div>

  <div class="calendar">
    <div class="dow">D</div><div class="dow">S</div><div class="dow">T</div><div class="dow">Q</div><div class="dow">Q</div><div class="dow">S</div><div class="dow">S</div>
    <div class="empty"></div><div class="empty"></div><div class="empty"></div>
    <div class="day">1</div><div class="day">2</div><div class="day">3</div>
    <div class="day highlight">4</div>
    <div class="day">5</div><div class="day">6</div><div class="day">7</div><div class="day">8</div><div class="day">9</div><div class="day">10</div><div class="day">11</div>
    <div class="day">12</div><div class="day">13</div><div class="day">14</div><div class="day">15</div><div class="day">16</div><div class="day">17</div><div class="day">18</div>
    <div class="day">19</div><div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div>
    <div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div><div class="day">30</div><div class="day">31</div><div class="empty"></div>
  </div>

  <div class="divider"></div>
  <div class="countdown">
    Faltam apenas
    <span id="cd">--</span>
    dias
  </div>
  <div class="ornament">✦ ❀ ✦</div>
</div>

<script>
function update(){
  const now=new Date();
  const target=new Date(now.getFullYear(),6,4);
  if(now.getMonth()>6) target.setFullYear(now.getFullYear()+1);
  const diff=target-now;
  const days=Math.max(0,Math.ceil(diff/(1000*60*60*24)));
  document.getElementById('cd').textContent=days;
}
update();
setInterval(update,3600000);
</script>
</body>
</html>
